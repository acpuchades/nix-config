# Evaluate both hosts on every push/PR, so breakage is caught before a deploy
# instead of by `nixos-rebuild` on the box. Eval-only — nothing is built, so
# this needs no builders, no aarch64-darwin runner (pure evaluation is
# platform-independent), and no binary cache.
#
# One repository secret is required: NIX_GITHUB_PAT, a CLASSIC PAT with the
# `repo` scope — the two fugazi tarball inputs are a PRIVATE repo fetched via
# netrc during evaluation (see flake.nix). It must be classic: github.com's
# `/archive/refs/heads/*.tar.gz` endpoint does not accept fine-grained tokens
# and answers 404 no matter how the token is scoped (NixOS/nixpkgs#321481).
# That is the same 404 GitHub returns for a repo the token cannot see, so the
# failure reads as a permissions problem and is not one — hence the preflight
# in .github/actions/private-inputs-netrc, which probes api.github.com to tell
# the two apart. Same token as the homeserver's github/token
# (machines/homeserver/sops.nix).
#
# When the secret is absent the job skips with a notice rather than failing,
# because fork PRs never receive secrets. When it is present but cannot read
# the repo the job fails at the preflight — deliberately, since on this repo's
# own pushes a dud token means the evals are silently not running.
#
# Note the two inputs track branch HEADS unpinned by flake.lock, so CI
# evaluates against the branches' current tips — the same thing a rebuild on
# the box would fetch.
name: eval

on:
  push:
    branches: [ main ]
  pull_request:

# Eval only reads the checkout; the private inputs authenticate with their own
# PAT, so the job's GITHUB_TOKEN needs nothing beyond read.
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: a tag can be moved to arbitrary code, and this
      # job holds NIX_GITHUB_PAT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - uses: ./.github/actions/private-inputs-netrc
        with:
          pat: ${{ secrets.NIX_GITHUB_PAT }}

      - name: Evaluate homeserver
        if: env.skip != 'true'
        run: nix eval --raw .#nixosConfigurations.homeserver.config.system.build.toplevel.drvPath

      - name: Evaluate MacBook
        if: env.skip != 'true'
        run: nix eval --raw .#darwinConfigurations.MacBook-Pro-de-Alejandro.config.system.build.toplevel.drvPath

  # Formatting and lints. A separate job because it needs no secrets, so it runs
  # on fork PRs too. Tools come from the nixpkgs revision pinned in flake.lock —
  # the same nixfmt `nix fmt` runs locally — without evaluating the flake (whose
  # private inputs this job has no token for).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: nixfmt, statix, deadnix
        run: |
          set -euo pipefail
          nixpkgs="github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)"
          nix shell "$nixpkgs#nixfmt" "$nixpkgs#statix" "$nixpkgs#deadnix" --command bash -euo pipefail -c '
            git ls-files -z "*.nix" | xargs -0 nixfmt --check
            statix check .
            # Unused names in lambda PATTERNS (`{ pkgs, ... }:`) are idiomatic
            # module signatures, so only bindings and plain arguments count.
            deadnix --fail --no-lambda-pattern-names .
          '
