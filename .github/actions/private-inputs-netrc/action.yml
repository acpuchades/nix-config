# Netrc for the PRIVATE tarball inputs (fugazi-web, titan-web; see flake.nix), with a
# preflight that tells a bad token apart from a broken flake. Shared by every
# workflow that evaluates the flake; the reasoning lives in eval.yml's header.
#
# Sets env.skip=true (and exits 0) when no token is available — fork PRs never
# receive secrets — so callers gate their steps on `env.skip != 'true'`.
name: Private flake inputs netrc
description: Write a netrc for the private flake inputs and preflight it.
inputs:
  pat:
    description: Classic GitHub PAT with the `repo` scope (secrets.NIX_GITHUB_PAT).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up netrc for the private flake inputs
      shell: bash
      env:
        NIX_GITHUB_PAT: ${{ inputs.pat }}
      run: |
        set -euo pipefail

        # Trim whitespace: a PAT pasted into the secrets UI with a trailing
        # newline yields a netrc whose password line nix cannot use.
        pat=$(printf '%s' "${NIX_GITHUB_PAT:-}" | tr -d '[:space:]')

        if [ -z "$pat" ]; then
          echo "skip=true" >> "$GITHUB_ENV"
          echo "::notice::NIX_GITHUB_PAT not available (fork PR?) — skipping evals"
          exit 0
        fi

        umask 077
        printf 'machine github.com\n  login x-access-token\n  password %s\n' \
          "$pat" > "$RUNNER_TEMP/netrc"

        # Preflight the credential with the exact request nix's tarball
        # fetcher makes, against every private input URL in flake.nix. Without
        # this a token that cannot read the repo surfaces as a 300-line nix
        # eval trace ending in a bare `HTTP error 404`, which reads like a
        # broken flake rather than a broken secret. Authenticated, github.com
        # 302s to codeload with a signed token in the URL; unauthenticated it
        # 404s (GitHub does not reveal private repos with a 403).
        urls=$(grep -oE 'https://github\.com/acpuchades/(fugazi-web|titan-web)/archive/[^"]+\.tar\.gz' flake.nix | sort -u) || true
        if [ -z "$urls" ]; then
          echo "::error::no private tarball inputs (fugazi-web, titan-web) found in flake.nix — this preflight needs updating"
          exit 1
        fi
        for url in $urls; do
          repo=${url#https://github.com/}; repo=${repo%%/archive/*}
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --netrc-file "$RUNNER_TEMP/netrc" "$url")
          case "$code" in
            200|302) echo "ok ($code): $url" ; continue ;;
          esac

          # Failed. Ask api.github.com the same question with a Bearer
          # header: it DOES accept fine-grained tokens, so a 200 here next to
          # a 404 above means the token's permissions are fine and its TYPE
          # is not.
          api=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $pat" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo")
          if [ "$api" = 200 ]; then
            echo "::error::NIX_GITHUB_PAT can read $repo through api.github.com (HTTP 200) but not $url (HTTP $code) — that is the signature of a FINE-GRAINED token. github.com's archive endpoint only accepts classic tokens. Re-issue as a classic PAT with the 'repo' scope and re-set the secret; no amount of re-scoping a fine-grained one will fix it."
          else
            echo "::error::NIX_GITHUB_PAT cannot read $repo (archive HTTP $code, api.github.com HTTP $api). The token is expired, revoked, or lacks the 'repo' scope. Re-issue a classic PAT with 'repo' and re-set the secret."
          fi
          exit 1
        done

        echo "NIX_CONFIG=netrc-file = $RUNNER_TEMP/netrc" >> "$GITHUB_ENV"
